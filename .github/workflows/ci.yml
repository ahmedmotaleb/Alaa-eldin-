name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alaa_eldin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alaa_eldin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install storefront dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Apply database migrations
        run: npm run db:migrate:dev
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Build storefront
        run: npm run build

      - name: Build admin
        run: npm run build
        working-directory: admin
