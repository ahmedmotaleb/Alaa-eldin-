name: Android APK

# بناء نسخة أندرويد فعلية في CI. debug بيتبني على كل push/PR من غير أي أسرار؛ نسخة release
# الموقّعة بتتبني بس لما تتطلب صراحة (workflow_dispatch) وبتحتاج أسرار التوقيع كاملة.
#
# البيئة هنا مثبّتة بالإصدارات اللي المشروع محتاجها فعلاً:
#   Node    22.12+  (Capacitor CLI 8 محتاج 22+، وVite 7 محتاج 22.12+)
#   JDK     21      (نفس مستوى ترجمة Java في capacitor.build.gradle)
#   SDK     36      (compileSdk/targetSdk في android/variables.gradle)
#   Gradle  8.14.3  عن طريق الـ wrapper المتتبَّع في الريبو (مش نسخة عامة)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'ابنِ نسخة release موقّعة (محتاجة أسرار التوقيع)'
        type: boolean
        default: false

env:
  NODE_VERSION: '22.12.0'
  JAVA_VERSION: '21'

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      # نفس بوابة الرابط اللي بتشتغل محلياً — بتفشل لو الأصل ناقص/مش HTTPS/localhost،
      # عشان CI ما ينتجش APK مكسور بصمت. القيمة الافتراضية هي رابط الإنتاج (موجود أصلاً
      # في .env.example وANDROID_BUILD.md، مش سر)، ومتغيّر المستودع بيتجاوزها لو اتظبط.
      - name: Validate native API origin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://alaa-eldin-production.up.railway.app' }}
          ORIGIN_SOURCE: ${{ vars.VITE_API_BASE_URL && 'repository variable' || 'workflow default' }}
        run: |
          echo "API origin: $VITE_API_BASE_URL (from: $ORIGIN_SOURCE)"
          npm run check:native-origin

      - name: Build web assets and sync to Android
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://alaa-eldin-production.up.railway.app' }}
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # فشل صريح لو المخرج مش موجود — نجاح مهمة Gradle لوحده مش دليل على وجود APK.
      - name: Verify debug APK exists
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::لم يُنتَج ملف APK على المسار $APK"; exit 1; }
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: \`$APK_SHA256\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Signed release APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    # بيئة محمية: حط أسرار التوقيع هنا عشان تتطلب موافقة قبل أي بناء release.
    environment: android-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Validate native API origin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://alaa-eldin-production.up.railway.app' }}
        run: npm run check:native-origin

      - name: Build web assets and sync to Android
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://alaa-eldin-production.up.railway.app' }}
        run: npm run android:sync

      # الـ keystore بيتخزّن كـ base64 في الأسرار وبيتفك هنا لملف مؤقت. build.gradle
      # بيقرأ ANDROID_KEYSTORE_PATH، فلازم نمرّر المسار الفعلي بعد فك الترميز.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::السر ANDROID_KEYSTORE_BASE64 غير مضبوط"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore" || { echo "::error::فشل فك ترميز الـ keystore"; exit 1; }

      # ملف keystore.properties لو كان موجود بياخد أولوية على متغيرات البيئة في
      # build.gradle — بنتأكد إنه مش موجود عشان قيم CI هي اللي تتستخدم فعلاً.
      - name: Ensure no stale keystore.properties overrides CI secrets
        run: rm -f android/keystore.properties

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # اسم الملف أو نجاح المهمة مش دليل على التوقيع — لازم apksigner يتأكد فعلياً
      # ويطبع الشهادة عشان تتقارن ببصمة مفتاح المالك.
      - name: Verify signature and print certificate
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::لم يُنتَج ملف APK على المسار $APK"; exit 1; }
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Signed release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: \`$APK_SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "قارن بصمة الشهادة المطبوعة أعلاه ببصمة مفتاح الإصدار المملوك قبل التوزيع." >> "$GITHUB_STEP_SUMMARY"
