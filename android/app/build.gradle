apply plugin: 'com.android.application'

// توقيع الإصدار (release signing) — القيم بتيجي من android/keystore.properties (ملف محلي
// غير مرفوع لـ Git، راجع .gitignore) أو من متغيرات بيئة (ANDROID_KEYSTORE_PATH,
// ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) — لا كلمة سر ولا
// مسار keystore متثبّت هنا في الكود.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// لازم المدخلات الأربعة كلها تكون موجودة — مش المسار بس. قبل كده الفحص كان بيتأكد من
// وجود ملف الـ keystore فقط، وفي حالة غيابه كان بناء release بيكمل من غير signingConfig
// خالص وينتج APK **غير موقّع** بصمت (رغم إن التعليق كان بيدّعي إنه بيفشل بوضوح).
def resolvedKeystorePath = keystoreProps.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
def resolvedStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def resolvedKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def resolvedKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')

def missingSigningInputs = []
if (!resolvedKeystorePath) {
    missingSigningInputs << 'ANDROID_KEYSTORE_PATH (أو storeFile في keystore.properties)'
} else if (!file(resolvedKeystorePath).exists()) {
    missingSigningInputs << "ملف الـ keystore غير موجود على المسار: ${resolvedKeystorePath}"
}
if (!resolvedStorePassword) missingSigningInputs << 'ANDROID_KEYSTORE_PASSWORD (أو storePassword)'
if (!resolvedKeyAlias) missingSigningInputs << 'ANDROID_KEY_ALIAS (أو keyAlias)'
if (!resolvedKeyPassword) missingSigningInputs << 'ANDROID_KEY_PASSWORD (أو keyPassword)'

def hasReleaseSigning = missingSigningInputs.isEmpty()

// الحارس الفعلي: أي مهمة assemble/bundle لـ release من غير توقيع كامل بتفشل البناء فوراً
// برسالة بتقول الناقص بالظبط. بناء debug مش متأثر إطلاقاً (بيستخدم مفتاح debug الافتراضي)،
// عشان CI والمطوّرين يقدروا يبنوا debug من غير أي أسرار.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains('release') && (name.contains('assemble') || name.contains('bundle'))
    }
    if (buildingRelease && !hasReleaseSigning) {
        throw new GradleException(
            "بناء release متوقف: مدخلات التوقيع ناقصة.\n  - " +
            missingSigningInputs.join("\n  - ") +
            "\nراجع ANDROID_BUILD.md لطريقة ضبط keystore.properties أو متغيرات البيئة."
        )
    }
}

android {
    namespace = "com.alaaeldin.supermarket"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.alaaeldin.supermarket"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(resolvedKeystorePath)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services plugin اتشال عمداً — التطبيق مالوش استخدام لإشعارات Firebase حالياً.
// لو اتضاف لاحقاً، رجّع classpath 'com.google.gms:google-services:...' في android/build.gradle
// وحط google-services.json هنا قبل ما ترجّع الكود ده.
